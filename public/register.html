<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campaign Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span>Campaign Hub</span>
        </div>
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Get started with your campaign management workspace</p>
      </div>

      <!-- Server & Validation Error Banner -->
      <div id="error-banner" class="error-banner"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-input"
            placeholder="Jane Doe"
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="name@company.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="At least 6 characters"
            required
            minlength="6"
            autocomplete="new-password"
          >
          <span class="form-hint">Must be at least 6 characters long.</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
            placeholder="Re-enter your password"
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <span>Already have an account? </span>
        <a href="/index.html" style="font-weight: 600;">Sign in</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="/js/auth.js"></script>
</body>
</html>
